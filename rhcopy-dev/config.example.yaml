# rhcopy — config. Copy to config.yaml and edit.
# Anything under sizing / gates / exits / execution can also be changed live from Telegram:
#   /set exits.stop_loss_pct 40      /get gates.max_chase_pct      /config

live: false                 # owner's starting mode (each user switches LIVE in 👛 Кошелёк)
                            # PAPER = real Relay quotes, simulated fills, nothing is sent
paper_cash_usd: 500         # paper bankroll for every new user

rpc: https://rpc.mainnet.chain.robinhood.com
fallback_rpc: https://robinhood.drpc.org
poll_seconds: 1.0
max_catchup_blocks: 3000    # ~5 min at 0.1 s blocks; older signals are stale anyway
log_chunk_blocks: 2000

usdg: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"   # canonical USDG (6 decimals). Other "USDG" are fakes.
weth: "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
ignore_tokens: []           # extra tokens never to copy

# The owner's traders (others add theirs with buttons). EVM address: copyfomo -> /find <name>.
wallets: []
# example:
# wallets:
#   - address: "0xПОЛНЫЙ_EVM_АДРЕС_ИЗ_/find"
#     label: "Salem"
#     solana: ""            # можно пусто: бот найдёт сам (/learnpair)
#     ticket_usd: 20        # необязательно

# Networks to copy in (each user can switch them in ⚙️ Настройки → 🌐 Сети)
chains:
  robinhood: true
  ethereum: true
  bsc: true
  base: true
  solana: true

ethereum:
  # Public nodes work without any key (the bot switches between them on errors).
  # For reliability put your own endpoint into .env as ETH_RPC_URL (e.g. a free Alchemy key) — it is tried first.
  rpc:
    - https://eth.drpc.org
    - https://rpc.mevblocker.io
    - https://eth-mainnet.public.blastapi.io
  poll_seconds: 6           # a block every 12 s; checking every 6 s is enough
  log_chunk_blocks: 40
  max_catchup_blocks: 25    # ~5 min after a restart; older signals are stale anyway
  min_gas_eth: 0.002        # live: below this ETH balance no new buys (gas is reserved for exits)
  max_gas_pct: 3.0          # gas on Ethereum costs more: allow up to 3% of the ticket

bsc:
  # BNB Chain. The trade stablecoin is USDT with 18 decimals (not 6) — the bot handles that itself.
  # Public nodes that serve eth_getLogs by topics without a contract address (your own node -> .env BSC_RPC_URL):
  rpc:
    - https://rpc-bsc.48.club
    - https://56.rpc.thirdweb.com
    - https://1rpc.io/bnb       # caps eth_getLogs at 50 blocks per call
  poll_seconds: 2
  log_chunk_blocks: 45         # keep <= 50 for 1rpc.io
  max_catchup_blocks: 600      # ~0.45 s blocks
  min_gas_eth: 0.003           # here the gas coin is BNB
  max_gas_pct: 1.5

base:
  # Base (Coinbase L2). Trade stablecoin USDC (6 decimals). Own node -> .env BASE_RPC_URL.
  rpc:
    - https://mainnet.base.org
    - https://8453.rpc.thirdweb.com
    - https://gateway.tenderly.co/public/base
  poll_seconds: 3
  log_chunk_blocks: 500
  max_catchup_blocks: 150      # ~2 s blocks
  min_gas_eth: 0.0005          # gas coin is ETH
  max_gas_pct: 1.5

solana:
  # Free endpoints work for a start; for reliable real-time detection put HELIUS_API_KEY into .env
  # (helius.dev, free plan) — it replaces both lines below.
  rpc: https://solana-rpc.publicnode.com
  ws: wss://api.mainnet-beta.solana.com
  poll_seconds: 5           # fallback polling if the WebSocket is down
  min_sol: 0.02             # live: below this SOL balance no new buys (fees + token-account deposits)
  est_fee_sol: 0.0002       # fee estimate per swap for the gas gate and paper PnL
  round_trip_check: false   # extra Jupiter quote per signal (costs rate limit on the free tier)
  ws_wallets_per_conn: 50   # watch this many wallets per WebSocket; more wallets -> more connections

# Wallet import (👥 Трейдеры -> 📥 Импорт / 🏆 Топ KOL). See README.
sources:
  max_traders_per_user: 200

sizing:
  ticket_usd: 15            # fixed ticket per copy
  max_bank_fraction: 0.04   # never more than 4% of equity in one position
  max_liquidity_fraction: 0.0025   # never more than 0.25% of pool liquidity (~0.5% impact)
  max_positions: 10
  min_ticket_usd: 3

gates:
  max_signal_age_s: 60      # never chase a buy older than this
  min_origin_usd: 50        # ignore the trader's dust/probe buys
  min_liquidity_usd: 10000
  min_mcap_usd: 0           # 0 = off
  max_mcap_usd: 0           # 0 = off
  min_pool_age_minutes: 2
  max_chase_pct: 25         # skip if our price is already this far above the trader's fill
  max_price_impact_pct: 5
  max_round_trip_loss_pct: 15   # buy-then-sell-back quote loses more -> thin pool / tax / trap
  honeypot_min_buys: 30
  honeypot_min_sell_ratio: 0.15 # with 30+ buys in 24h, require sells >= 15% of buys
  plant_gate: true          # skip fills someone else paid for in ETH
  relay_gate: strict        # strict: FOMO fill signed by the trader's own Solana wallet
                            # fomo:   any FOMO fill from Solana (weaker)   off: no provenance check
  relay_wait_s: 1.5         # Relay indexes a fill ~5-7 s after the block; don't wait that long
  relay_unknown: buy        # buy = verify every second after buying, dump at once if planted | skip
  relay_watch_s: 120
  max_gas_pct: 1.0          # skip if gas > 1% of the ticket (protects during gas spikes)
  reentry_cooldown_hours: 24
  skip_stock_tokens: true
  require_market_data: true # skip tokens DexScreener does not know yet
  # Confluence (Этап 3): buy only when several independent watched wallets buy the same coin
  confluence_min: 1         # 1 = off; 2 or 3 = need that many independent wallets in the window
  confluence_window_min: 10 # minutes to collect them (5 / 10 / 30)
  # Insider / launch-risk filter (Этап 4). off | soft (skip only on a proven violation) | strict
  insider_check: soft
  max_bundle_pct: 25        # launch-bundle share of supply
  max_dev_pct: 10           # creator's share of supply
  max_top10_pct: 60         # top-10 holders (pools / curves / burns excluded)
  max_insider_pct: 20       # wallets tied to the creator
  skip_dev_rugger: true     # skip tokens whose creator has rugged before

exits:
  mode: ladder              # ladder | timed | both
  ladder:                   # price take-profits; `sell` = share of the ORIGINAL position
    - {at_pct: 50, sell: 0.50}
    - {at_pct: 300, sell: 0.25}
  timed:                    # time tranches (used in mode timed/both)
    - {after_min: 5, sell: 0.75}
    - {after_min: 10, sell: 0.25}
  stop_loss_pct: 50
  stop_after_tp: keep       # keep | breakeven
  follow_origin_exit: true  # sell the rest when the trader starts selling
  max_hold_hours: 24
  price_check_seconds: 10

execution:
  buy_slippage_bps: 300
  sell_slippage_bps: 600
  sell_slippage_max_bps: 2500   # failed sells retry with 1.5x wider slippage up to this
  receipt_timeout_s: 60
  unsellable_failures: 12
  unsellable_hours: 3
  min_gas_eth: 0.0005       # below this no new buys (gas is reserved for exits)

telegram:
  enabled: true
  notify_skips: false
